<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>インフレ病院</title>
<style>
  :root { --teal: #1f9d8f; --teal-d: #157a6f; --mint: #e8f6f3; --cross: #e5484d; --ink: #1d3b43; --sub: #5b7a80; }
  * { box-sizing: border-box; }
  body { font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 0 14px 110px; text-align: center; background: linear-gradient(#eaf7f5, #f7fbfa 240px); color: var(--ink); -webkit-text-size-adjust: 100%; }
  header { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 0 6px; }
  header .cross { width: 30px; height: 30px; background: var(--cross); border-radius: 8px; position: relative; flex: none; }
  header .cross::before, header .cross::after { content: ""; position: absolute; background: #fff; border-radius: 2px; }
  header .cross::before { left: 12px; top: 6px; width: 6px; height: 18px; }
  header .cross::after { left: 6px; top: 12px; width: 18px; height: 6px; }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: .08em; color: var(--teal-d); }
  .panel { background: #fff; border-radius: 14px; padding: 12px; margin: 10px 0; border: 1px solid #d5ebe7; box-shadow: 0 2px 6px rgba(31,157,143,.12); }
  .label { font-size: .85rem; color: var(--sub); }
  .num { font-size: 1.6rem; font-weight: bold; word-break: break-all; font-variant-numeric: tabular-nums; }
  #hp { border-left: 6px solid var(--cross); }
  #hp .num { color: var(--cross); }
  #mine .num { color: #1a78a8; }
  #rival .num { color: #b0660f; }
  #treat { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(92vw, 440px); font-size: 1.6rem; font-family: inherit; font-weight: bold; padding: 18px 0; border: 0; border-radius: 16px; background: var(--teal); color: #fff; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; box-shadow: 0 4px 0 var(--teal-d), 0 6px 14px rgba(0,0,0,.2); }
  #treat:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 1px 0 var(--teal-d); }
  #rx { border: 2px solid var(--teal); background: var(--mint); }
  #rx button { display: block; width: 100%; margin: 6px 0; padding: 12px; min-height: 48px; border: 1px solid #bfe3dc; border-radius: 10px; background: #fff; color: var(--ink); font-size: 1rem; font-family: inherit; cursor: pointer; text-align: left; touch-action: manipulation; }
  #rx button b { display: block; }
  #rx button span { font-size: .8rem; color: var(--sub); }
  #rx button:active { background: #cdeee7; }
  #perTap .num { font-size: 1.1rem; color: var(--teal-d); }
  #online input { font-size: 1rem; padding: 10px; width: 58%; border: 1px solid #bfe3dc; border-radius: 8px; font-family: inherit; }
  #online button { font-size: 1rem; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--teal); color: #fff; font-family: inherit; cursor: pointer; }
  #online button:disabled { background: #9bc9c3; }
  #fx { position: fixed; left: 0; right: 0; top: 30%; text-align: center; font-size: 3rem; font-weight: 900; color: var(--cross); text-shadow: 0 0 8px #fff, 0 0 16px #fc0; pointer-events: none; opacity: 0; }
  #fx.go { animation: pop 1.1s ease-out; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.3); } 20% { opacity: 1; transform: scale(1.4); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1) translateY(-30px); } }
  body.shake { animation: shake .4s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #result { position: fixed; inset: 0; background: rgba(20,50,50,.85); display: none; align-items: center; justify-content: center; overflow-y: auto; z-index: 10; }
  #result .box { background: #fff; border-radius: 16px; padding: 20px; width: 88%; max-width: 420px; border-top: 8px solid var(--cross); }
  #result h2 { margin: 0 0 8px; font-size: 1.6rem; color: var(--cross); }
  #result .top { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }
  #result button { font-size: 1rem; font-family: inherit; padding: 12px 28px; margin-top: 10px; border: 0; border-radius: 10px; background: var(--teal); color: #fff; cursor: pointer; }
  .small { font-size: .75rem; color: #6d8a8f; line-height: 1.6; }
  @media (max-width: 360px) { .num { font-size: 1.35rem; } #fx { font-size: 2.2rem; } }
</style>
</head>
<body>
<header><span class="cross"></span><h1>インフレ病院</h1></header>
<div class="panel" id="hp"><div class="label">患者 <span id="patientNo">1</span> 人目の HP（最大 <span id="hpMax">1</span>）</div><div class="num" id="hpNum">0</div></div>
<div class="panel" id="mine"><div class="label">自分の数字（治療 <span id="treatCount">0</span> 回）</div><div class="num" id="mineNum">0</div></div>
<div class="panel" id="rival"><div class="label" id="rivalLabel">相手（ダミー）の1回のダメージ ／ 2人分の合計</div><div class="num" id="rivalNum">0</div><div class="num" id="totalNum" style="color:#2a9">0</div></div>
<div class="panel" id="perTap"><div class="label">1回の治療のダメージ（処方 <span id="rxCount">0</span> 個）</div><div class="num" id="perTapNum">1</div></div>
<div class="panel" id="rx"><div class="label">処方を選んでください</div><div id="rxList"></div></div>
<div class="panel" id="online">
  <div class="label">オンライン対戦（合言葉を2人で同じにしてください）</div>
  <input id="code" placeholder="合言葉" maxlength="24">
  <button id="connect">接続</button>
  <div class="small" id="netStatus">未接続（ダミーの相手と治療中）</div>
  <div class="small">※「接続」を押すと、PeerJS Cloud（外部の接続仲介サーバー）と通信します。</div>
</div>
<div id="fx"></div>
<div id="result"><div class="box">
  <h2 id="resTitle"></h2>
  <div class="top" id="resTop"></div>
  <div class="label">あなたの貢献度（治した量）</div><div class="num" id="resMine" style="color:#17a"></div>
  <div class="label">相手の貢献度（治した量）</div><div class="num" id="resRival" style="color:#a60"></div>
  <button id="again">もう一度</button>
</div></div>
<button id="treat">治療</button>
<p class="small">患者を3人倒すと結果画面が出て、2人が治した量（貢献度）を比べて勝敗が決まります。処方は5回治療するごとに選べます。強さは「処方」だけで決まります。</p>
<script src="bignum.js"></script>
<script src="prescriptions.js"></script>
<script src="patient.js"></script>
<script src="coop.js"></script>
<script src="net.js"></script>
<script src="result.js"></script>
<script>
(function () {
  var B = BigNum;
  var state = {
    patient: Patient.create(0), // 患者（HP 1 から始まり、倒すたびに大きくなる）
    partner: Coop.dummyPartner(), // ダミーの相手
    mine: B.from(0),
    rival: B.from(0),         // 相手の数字（ステップ1では0のまま。通信は後のステップ）
    perTap: B.from(1),        // 1回の治療で増える量（処方で増える）
    taken: [],                // 取得した処方
    tapsToNext: 0,            // 次の処方提示までの治療回数
    treats: 0,                // 自分の治療回数
    online: false,            // 相手と接続中か
    partnerTreats: 0,         // 相手の治療回数
    defeated: 0,              // 倒した患者の数
    finished: false           // ラウンド終了（結果画面）
  };
  var conn = null, dummyTimer = null;
  var TAPS_PER_OFFER = 5;
  function $(id) { return document.getElementById(id); }
  function render() {
    $('hpNum').textContent = B.format(state.patient.hp);
    $('hpMax').textContent = B.format(state.patient.max);
    $('patientNo').textContent = state.patient.n + 1;
    $('mineNum').textContent = B.format(state.mine);
    $('rivalNum').textContent = B.format(state.partner.perTap);
    $('totalNum').textContent = B.format(Coop.combine(state.perTap, state.partner.perTap));
    $('perTapNum').textContent = B.format(state.perTap);
    $('rxCount').textContent = state.taken.length;
    $('rivalLabel').textContent = state.online ? '相手の1回のダメージ（相手の治療 ' + state.partnerTreats + ' 回）／ 2人分の合計' : '相手（ダミー）の1回のダメージ ／ 2人分の合計';
    $('treatCount').textContent = state.treats;
  }
  function effect(text) {
    var fx = $('fx');
    fx.textContent = text;
    fx.className = '';
    void fx.offsetWidth;
    fx.className = 'go';
    document.body.className = '';
    void document.body.offsetWidth;
    document.body.className = 'shake';
  }
  function showOffer() {
    var list = $('rxList');
    list.innerHTML = '';
    Prescriptions.offer().forEach(function (p) {
      var b = document.createElement('button');
      b.innerHTML = '<b></b><span></span>';
      b.firstChild.textContent = p.name;
      b.lastChild.textContent = p.desc;
      b.addEventListener('click', function () { choose(p); });
      list.appendChild(b);
    });
    $('rx').style.display = '';
  }
  function choose(p) {
    var r = Prescriptions.apply(state, p);
    state.perTap = r.perTap;
    state.taken = r.taken;
    state.tapsToNext = TAPS_PER_OFFER;
    $('rx').style.display = 'none';
    effect(p.fx);
    render();
  }
  // 治療：自分と相手の攻撃力が合わさって患者に入る
  function finish() {
    state.finished = true;
    var sm = Result.summary(Result.judge(state.mine, state.rival));
    $('resTitle').textContent = sm.title;
    $('resTop').textContent = sm.top;
    $('resMine').textContent = sm.mine;
    $('resRival').textContent = sm.rival;
    $('result').style.display = 'flex';
  }
  function strike(dmg) {
    if (state.finished) return;
    var r = Patient.hit(state.patient, dmg);
    state.patient = r.patient;
    if (r.defeated) {
      state.patient = Patient.next(state.patient);
      state.partner.onDefeat();
      state.defeated++;
      if (state.defeated >= Result.ROUND_PATIENTS) { effect('全員治療！'); finish(); return; }
      effect('次の患者！');
    }
  }
  function partnerTreat() { // ダミーの相手が自動で治療する
    if (state.online || state.finished) return;
    state.rival = B.add(state.rival, state.partner.perTap); // ダミーの貢献度
    strike(Coop.combine(B.from(0), state.partner.perTap));
    render();
  }
  function treat() {
    if (state.finished) return;
    state.mine = B.add(state.mine, state.perTap);
    state.treats++;
    if (conn && conn.open) conn.send(Net.makeTreat(state.treats, state.perTap, state.mine));
    // 接続中は、相手の分は相手の治療メッセージで入る（二重に数えない）
    if (!state.online) state.rival = B.add(state.rival, state.partner.perTap); // ダミーの貢献度
    strike(state.online ? state.perTap : Coop.combine(state.perTap, state.partner.perTap));
    if (state.tapsToNext > 0 && --state.tapsToNext === 0) showOffer();
    render();
  }
  // --- オンライン（PeerJS）：相手の治療を受け取り、自分の患者にも反映する ---
  function status(t) { $('netStatus').textContent = t; }
  function onData(raw) {
    var m = Net.parse(raw);
    if (!m) return; // 不正なデータは無視
    state.partner = { perTap: { m: m.perTap.m, e: m.perTap.e }, onDefeat: function () {} };
    var fresh = m.treats > state.partnerTreats; // 治療が増えたときだけ患者に当てる（接続・やり直しの通知では当てない）
    state.partnerTreats = m.treats;
    state.rival = { m: m.mine.m, e: m.mine.e };
    if (fresh) strike(state.partner.perTap);
    render();
  }
  function attach(c) {
    conn = c;
    c.on('open', function () {
      state.online = true;
      state.partner = { perTap: B.from(0), onDefeat: function () {} };
      status('接続しました！ 2人で治療しましょう');
      c.send(Net.makeTreat(state.treats, state.perTap, state.mine));
      render();
    });
    c.on('data', onData);
    c.on('close', function () { state.online = false; conn = null; state.partner = Coop.dummyPartner(); status('切断されました（ダミーの相手に戻ります）'); render(); });
    c.on('error', function () { status('通信エラーが起きました'); });
  }
  function connect() {
    var id = Net.roomId($('code').value);
    if (!id) { status('合言葉は1〜24文字の英数字・ひらがな・カタカナ・漢字・_ - が使えます'); return; }
    if (typeof Peer === 'undefined') {
      status('接続の準備中…');
      var sc = document.createElement('script');
      sc.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
      sc.onload = connect;
      sc.onerror = function () { status('PeerJS を読み込めませんでした'); };
      document.head.appendChild(sc);
      return;
    }
    $('connect').disabled = true;
    status('合言葉で相手を探しています…');
    var host = new Peer(id); // 先に入った人がホスト
    host.on('open', function () { status('相手の接続を待っています…'); });
    host.on('connection', function (c) { if (!conn) attach(c); else c.close(); });
    host.on('error', function (err) {
      if (err && err.type === 'unavailable-id') { // すでにホストがいる → 参加者になる
        var guest = new Peer();
        guest.on('open', function () { attach(guest.connect(id, { reliable: true })); });
        guest.on('error', function () { status('接続できませんでした'); $('connect').disabled = false; });
      } else { status('接続できませんでした'); $('connect').disabled = false; }
    });
  }
  $('connect').addEventListener('click', connect);
  $('again').addEventListener('click', function () {
    state.patient = Patient.create(0); state.mine = B.from(0); state.rival = B.from(0);
    state.perTap = B.from(1); state.taken = []; state.tapsToNext = 0; state.treats = 0;
    state.partnerTreats = 0; state.defeated = 0; state.finished = false;
    if (!state.online) state.partner = Coop.dummyPartner();
    $('result').style.display = 'none';
    if (conn && conn.open) conn.send(Net.makeTreat(0, state.perTap, state.mine)); // 相手にも最初からやり直しを伝える
    showOffer(); render();
  });
  $('treat').addEventListener('click', treat);
  showOffer();
  render();
  setInterval(partnerTreat, 3000);
  window.hospital = { state: state, render: render, treat: treat, choose: choose }; // 動作確認用
})();
</script>
</body>
</html>
